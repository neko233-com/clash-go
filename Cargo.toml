[package]
name = "clash-go"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"
description = "A native GPUI desktop client for Mihomo"
repository = "https://github.com/neko233-com/clash-go"

[dependencies]
gpui = "0.2.2"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
