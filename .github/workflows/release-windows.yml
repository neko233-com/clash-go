name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows x64
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package release
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match Cargo version v$version" }
          $stage = Join-Path $env:RUNNER_TEMP 'clash-go-release'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/clash-go.exe' $stage
          Copy-Item 'README.md', 'LICENSE', 'scripts/install.ps1' $stage
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath 'clash-go-windows-x64.zip' -CompressionLevel Optimal
          $hash = (Get-FileHash 'clash-go-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  clash-go-windows-x64.zip" | Set-Content -Path SHA256SUMS -Encoding ascii
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" clash-go-windows-x64.zip SHA256SUMS --title "$env:GITHUB_REF_NAME" --generate-notes
